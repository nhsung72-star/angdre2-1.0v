      // ---- Open-Meteo 날씨 조회 ----
      function mapWeatherCodeToKorean(code) {
        if (code === 0) return { label: '맑음', emoji: '☀️' };
        if (code === 1) return { label: '대체로 맑음', emoji: '🌤️' };
        if (code === 2) return { label: '구름 조금', emoji: '⛅' };
        if (code === 3) return { label: '흐림', emoji: '☁️' };
        if (code === 45 || code === 48) return { label: '안개', emoji: '🌫️' };
        if (code === 51 || code === 53 || code === 55) return { label: '이슬비', emoji: '🌦️' };
        if (code === 56 || code === 57) return { label: '진눈깨비', emoji: '🌧️' };
        if (code === 61 || code === 63 || code === 65) return { label: '비', emoji: '🌧️' };
        if (code === 66 || code === 67) return { label: '진눈깨비', emoji: '🌨️' };
        if (code === 71 || code === 73 || code === 75 || code === 77) return { label: '눈', emoji: '❄️' };
        if (code === 80 || code === 81 || code === 82) return { label: '소나기', emoji: '🌦️' };
        if (code === 85 || code === 86) return { label: '눈', emoji: '🌨️' };
        if (code === 95 || code === 96 || code === 99) return { label: '천둥번개', emoji: '⛈️' };
        return { label: '구름', emoji: '⛅' };
      }

      async function fetchOpenMeteoWeather(latitude, longitude, signal) {
        const params = new URLSearchParams({
          latitude: latitude.toFixed(4),
          longitude: longitude.toFixed(4),
          current: 'temperature_2m,apparent_temperature,weather_code',
          hourly: 'precipitation_probability',
          daily: 'temperature_2m_max,temperature_2m_min,precipitation_probability_max',
          timezone: 'Asia/Seoul',
          forecast_days: '1',
        });

        const response = await fetch(
          `https://api.open-meteo.com/v1/forecast?${params.toString()}`,
          { signal }
        );

        if (!response.ok) {
          throw new Error('날씨 정보를 불러오지 못했습니다.');
        }

        const data = await response.json();
        const currentTemp = data.current?.temperature_2m;
        const apparentTemp = data.current?.apparent_temperature;
        const weatherCode = data.current?.weather_code ?? 0;
        const maxTemp = data.daily?.temperature_2m_max?.[0];
        const minTemp = data.daily?.temperature_2m_min?.[0];

        if (
          typeof currentTemp !== 'number' ||
          typeof apparentTemp !== 'number' ||
          typeof maxTemp !== 'number' ||
          typeof minTemp !== 'number'
        ) {
          throw new Error('날씨 데이터 형식이 올바르지 않습니다.');
        }

        const currentHour = new Date().getHours();
        const hourlyProb = data.hourly?.precipitation_probability?.[currentHour];
        const dailyMaxProb = data.daily?.precipitation_probability_max?.[0];
        const precipitationProbability =
          typeof hourlyProb === 'number'
            ? hourlyProb
            : typeof dailyMaxProb === 'number'
              ? dailyMaxProb
              : 0;

        const { label, emoji } = mapWeatherCodeToKorean(weatherCode);

        return {
          temperature: Math.round(currentTemp),
          apparentTemperature: Math.round(apparentTemp),
          weatherCode,
          weatherLabel: label,
          weatherEmoji: emoji,
          minTemp: Math.round(minTemp),
          maxTemp: Math.round(maxTemp),
          precipitationProbability: Math.round(precipitationProbability),
        };
      }

                <path

                  stroke="#F4F1DE"
                  strokeWidth="2.4"

                <path

                  stroke="#24263B"
                  strokeWidth="2"
                  strokeLinejoin="round"

        return (
          <div
            className={`flex h-20 w-20 shrink-0 items-center justify-center rounded-2xl transition-colors ${bgClass}`}
            aria-hidden="true"
          >
            <svg viewBox="0 0 64 64" className="h-14 w-14" fill="none">
              <path
                d="M21 15L12 23L15 35L20 32L18 54H46L44 32L49 35L52 23L43 15L36 17L32 23L28 17L21 15Z"
                fill="#C9AE8B"
                stroke="#5C4730"
                strokeWidth="2.2"
                strokeLinejoin="round"
              />
              <path
                d="M25 15L32 25L39 15"
                fill="#8C3B3B"
                stroke="#4F1E1E"
                strokeWidth="2"
                strokeLinejoin="round"
              />
              <path
                d="M29 22V33"
                stroke="#8C3B3B"
                strokeWidth="4.5"
                strokeLinecap="round"
              />
              <rect
                x="19.5"
                y="35"
                width="25"
                height="3.5"
                rx="1.5"
                fill="#9E8260"
                stroke="#5C4730"
                strokeWidth="1.6"
              />
              <circle cx="28" cy="44" r="1.4" fill="#5C4730" />
              <circle cx="36" cy="44" r="1.4" fill="#5C4730" />
              <circle cx="28" cy="49" r="1.4" fill="#5C4730" />
              <circle cx="36" cy="49" r="1.4" fill="#5C4730" />
            </svg>
          </div>

      // ---- 1단계: 나에 대해 ----
      function getMissingPrompt(profile) {
        if (!profile.ageGroup) return '연령대를 골라 주세요';
        if (!profile.gender) return '성별을 골라 주세요';
        if (!profile.style) return '선호하는 옷 스타일을 골라 주세요';
        return null;
      }

      function AboutMeStep({
        profile,
        onChangeAgeGroup,
        onChangeGender,
        onChangeStyle,
        onNext,
      }) {
        const missingPrompt = getMissingPrompt(profile);
        const isComplete = missingPrompt === null;

        return (
          <div className="space-y-8">
            <div className="space-y-2">
              <p className="text-sm font-semibold text-blue-800">1단계 · 나에 대해</p>
              <h1 className="text-2xl font-extrabold tracking-tight text-zinc-900 sm:text-3xl text-balance">
                나에게 꼭 맞는 옷차림을 위해 알려 주세요
              </h1>
              <p className="text-base text-zinc-600 sm:text-lg">
                연령대, 성별, 선호하는 옷 스타일을 하나씩 선택해 주세요.
              </p>
            </div>

            <div className="grid grid-cols-1 gap-8 lg:grid-cols-12 lg:items-start">
              {/* 왼쪽 영역: 연령대 + 성별 */}
              <div className="space-y-8 lg:col-span-5">
                {/* 연령대 */}
                <section
                  aria-labelledby="age-group-heading"
                  className="rounded-3xl border border-zinc-200 bg-white p-5 sm:p-6"
                >
                  <div className="mb-4 flex items-baseline justify-between gap-2">
                    <h2
                      id="age-group-heading"
                      className="text-xl font-bold text-zinc-900"
                    >
                      연령대
                    </h2>
                    <span className="text-sm font-medium text-zinc-500">
                      1개 선택
                    </span>
                  </div>

                  <div
                    role="radiogroup"
                    aria-labelledby="age-group-heading"
                    className="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-2"
                  >
                    {AGE_GROUPS.map((age) => {
                      const isSelected = profile.ageGroup === age;
                      return (
                        <button
                          key={age}
                          type="button"
                          role="radio"
                          aria-checked={isSelected}
                          onClick={() => onChangeAgeGroup(age)}
                          className={`min-h-[56px] rounded-2xl px-4 py-3 text-lg font-bold transition-all focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-800 active:scale-[0.98] ${
                            isSelected
                              ? 'border-[3px] border-blue-800 bg-blue-50 text-blue-950 shadow-sm'
                              : 'border border-zinc-200 bg-stone-50 text-zinc-800 hover:border-zinc-400 hover:bg-white'
                          }`}
                        >
                          {age}
                        </button>
                      );
                    })}
                  </div>
                </section>

                {/* 성별 */}
                <section
                  aria-labelledby="gender-heading"
                  className="rounded-3xl border border-zinc-200 bg-white p-5 sm:p-6"
                >
                  <div className="mb-4 flex items-baseline justify-between gap-2">
                    <h2
                      id="gender-heading"
                      className="text-xl font-bold text-zinc-900"
                    >
                      성별
                    </h2>
                    <span className="text-sm font-medium text-zinc-500">
                      1개 선택
                    </span>
                  </div>

                  <div
                    role="radiogroup"
                    aria-labelledby="gender-heading"
                    className="grid grid-cols-1 gap-3 sm:grid-cols-3 lg:grid-cols-1 xl:grid-cols-3"
                  >
                    {GENDERS.map((gender) => {
                      const isSelected = profile.gender === gender;
                      return (
                        <button
                          key={gender}
                          type="button"
                          role="radio"
                          aria-checked={isSelected}
                          onClick={() => onChangeGender(gender)}
                          className={`min-h-[56px] rounded-2xl px-4 py-3 text-lg font-bold whitespace-nowrap transition-all focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-800 active:scale-[0.98] ${
                            isSelected
                              ? 'border-[3px] border-blue-800 bg-blue-50 text-blue-950 shadow-sm'
                              : 'border border-zinc-200 bg-stone-50 text-zinc-800 hover:border-zinc-400 hover:bg-white'
                          }`}
                        >
                          {gender}
                        </button>
                      );
                    })}
                  </div>
                </section>
              </div>

              {/* 오른쪽 영역: 선호하는 옷 스타일 4가지 카드 */}
              <section
                aria-labelledby="style-heading"
                className="rounded-3xl border border-zinc-200 bg-white p-5 sm:p-6 lg:col-span-7"
              >
                <div className="mb-4 flex items-baseline justify-between gap-2">
                  <h2
                    id="style-heading"
                    className="text-xl font-bold text-zinc-900"
                  >
                    선호하는 옷 스타일
                  </h2>
                  <span className="text-sm font-medium text-zinc-500">
                    하나만 선택
                  </span>
                </div>

                <div
                  role="radiogroup"
                  aria-labelledby="style-heading"
                  className="grid grid-cols-1 gap-3.5 sm:grid-cols-2 lg:grid-cols-1 xl:grid-cols-2"
                >
                  {OUTFIT_STYLES.map((style) => {
                    const isSelected = profile.style === style.id;
                    return (
                      <label
                        key={style.id}
                        htmlFor={`style-${style.id}`}
                        className={`flex cursor-pointer items-center gap-4 rounded-2xl p-4 transition-all focus-within:outline focus-within:outline-2 focus-within:outline-offset-2 focus-within:outline-blue-800 active:scale-[0.99] ${
                          isSelected
                            ? 'border-[3px] border-blue-800 bg-blue-50/70 shadow-sm'
                            : 'border border-zinc-200 bg-stone-50/70 hover:border-zinc-400 hover:bg-white'
                        }`}
                      >
                        <StyleIllustration
                          styleId={style.id}
                          selected={isSelected}
                        />

                        <div className="min-w-0 flex-1 space-y-1">
                          <div className="text-lg font-bold text-zinc-900">
                            {style.name}
                          </div>
                          <p className="text-[15px] leading-snug text-zinc-600">
                            {style.description}
                          </p>
                        </div>

                        <div className="flex min-h-[44px] min-w-[44px] shrink-0 items-center justify-center">
                          <input
                            id={`style-${style.id}`}
                            type="radio"
                            name="outfit-style"
                            value={style.id}
                            checked={isSelected}
                            onChange={() => onChangeStyle(style.id)}
                            className="h-6 w-6 cursor-pointer accent-blue-800"
                          />
                        </div>
                      </label>
                    );
                  })}
                </div>
              </section>
            </div>

            {/* 하단 안내 문구 및 다음 버튼 */}
            <div className="space-y-3 border-t border-zinc-200 pt-6">
              {missingPrompt && (
                <div
                  role="status"
                  aria-live="polite"
                  className="flex items-center justify-center gap-2 rounded-2xl border border-amber-200 bg-amber-50 px-4 py-3 text-base font-semibold text-amber-900"
                >
                  <AlertCircleIcon className="h-5 w-5 shrink-0 text-amber-700" />
                  <span>{missingPrompt}</span>
                </div>
              )}

              <button
                type="button"
                disabled={!isComplete}
                onClick={onNext}
                className={`flex min-h-[60px] w-full items-center justify-center gap-2 rounded-2xl px-6 py-4 text-xl font-bold transition-all focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-800 ${
                  isComplete
                    ? 'cursor-pointer bg-blue-900 text-white shadow-md hover:bg-blue-800 active:scale-[0.99]'
                    : 'cursor-not-allowed bg-zinc-200 text-zinc-500'
                }`}
              >
                <span>다음</span>
                <ArrowRightIcon className="h-6 w-6 shrink-0" />
              </button>
            </div>
          </div>
        );
      }

      // ---- 2단계: 오늘 날씨 ----
      function WeatherStep({ onBack }) {
        const [selectedCity, setSelectedCity] = useState(null);
        const [selectedSeoulDistrict, setSelectedSeoulDistrict] = useState('강남구');
        const [seoulSearch, setSeoulSearch] = useState('');
        const [selectedSubRegionId, setSelectedSubRegionId] = useState(null);
        const [selectedLocation, setSelectedLocation] = useState(null);

        const [gpsStatus, setGpsStatus] = useState('checking');
        const [weatherStatus, setWeatherStatus] = useState('idle');
        const [weather, setWeather] = useState(null);
        const [weatherError, setWeatherError] = useState(null);
        const [recommendNotice, setRecommendNotice] = useState(null);

        const manualPickedRef = useRef(false);
        const abortControllerRef = useRef(null);

        const loadWeatherForCoords = useCallback(async (latitude, longitude) => {
          if (abortControllerRef.current) {
            abortControllerRef.current.abort();
          }
          const controller = new AbortController();
          abortControllerRef.current = controller;

          setWeatherStatus('loading');
          setWeatherError(null);

          try {
            const result = await fetchOpenMeteoWeather(
              latitude,
              longitude,
              controller.signal
            );
            if (!controller.signal.aborted) {
              setWeather(result);
              setWeatherStatus('success');
            }
          } catch (err) {
            if (err && err.name === 'AbortError') {
              return;
            }
            setWeatherError('날씨 정보를 가져오지 못했어요. 다시 시도해 주세요.');
            setWeatherStatus('error');
          }
        }, []);

        const requestCurrentPosition = useCallback(
          (isRetry = false) => {
            if (isRetry) {
              manualPickedRef.current = false;
            }

            if (typeof navigator === 'undefined' || !navigator.geolocation) {
              setGpsStatus('failed');
              return;
            }

            setGpsStatus('checking');

            navigator.geolocation.getCurrentPosition(
              (position) => {
                if (manualPickedRef.current && !isRetry) {
                  return;
                }
                const { latitude, longitude } = position.coords;
                setGpsStatus('success');
                setSelectedCity(null);
                setSelectedSubRegionId(null);
                setSelectedLocation({
                  label: '현재 내 위치',
                  latitude,
                  longitude,
                  source: 'gps',
                });
                loadWeatherForCoords(latitude, longitude);
              },
              () => {
                if (manualPickedRef.current && !isRetry) {
                  return;
                }
                setGpsStatus('failed');
              },
              {
                enableHighAccuracy: false,
                timeout: 5000,
                maximumAge: 0,
              }
            );
          },
          [loadWeatherForCoords]
        );

        useEffect(() => {
          requestCurrentPosition(false);
          return () => {
            if (abortControllerRef.current) {
              abortControllerRef.current.abort();
            }
          };
        }, [requestCurrentPosition]);

        const handleSelectCity = (city) => {
          manualPickedRef.current = true;
          setSelectedCity(city);
          setSelectedSubRegionId(null);
          setSeoulSearch('');
          setRecommendNotice(null);
          if (city.id === 'seoul' && city.districts && city.districts.length > 0) {
            setSelectedSeoulDistrict(city.districts[0]);
          }
        };

        const handleSelectSubRegion = (city, subRegion) => {
          manualPickedRef.current = true;
          setSelectedSubRegionId(subRegion.id);
          setRecommendNotice(null);

          const fullLabel = subRegion.district
            ? `${city.name} ${subRegion.district} ${subRegion.name}`
            : `${city.name} ${subRegion.name}`;

          setSelectedLocation({
            label: fullLabel,
            latitude: subRegion.latitude,
            longitude: subRegion.longitude,
            source: 'manual',
          });

          loadWeatherForCoords(subRegion.latitude, subRegion.longitude);
        };

        const visibleSubRegions = useMemo(() => {
          if (!selectedCity) return [];
          if (selectedCity.id !== 'seoul') {
            return selectedCity.subRegions;
          }

          const keyword = seoulSearch.trim();
          if (keyword.length > 0) {
            return selectedCity.subRegions.filter(
              (item) =>
                item.name.includes(keyword) ||
                (item.district && item.district.includes(keyword))
            );
          }

          return selectedCity.subRegions.filter(
            (item) => item.district === selectedSeoulDistrict
          );
        }, [selectedCity, selectedSeoulDistrict, seoulSearch]);

        const handleRecommendClick = () => {
          if (!selectedLocation || weatherStatus !== 'success') {
            setRecommendNotice('먼저 지역을 골라 오늘 날씨를 확인해 주세요.');
            return;
          }
          setRecommendNotice('옷차림 추천 기능은 다음 단계에서 준비될 예정이에요.');
        };

        return (
          <div className="space-y-8">
            <div className="space-y-2">
              <p className="text-sm font-semibold text-blue-800">2단계 · 오늘 날씨</p>
              <h1 className="text-2xl font-extrabold tracking-tight text-zinc-900 sm:text-3xl text-balance">
                오늘 어느 지역의 날씨를 확인할까요?
              </h1>
            </div>

            {gpsStatus === 'failed' && !selectedLocation && (
              <div
                role="status"
                aria-live="polite"
                className="flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-amber-200 bg-amber-50 px-5 py-4"
              >
                <div className="flex items-center gap-3">
                  <MapPinIcon className="h-6 w-6 shrink-0 text-amber-800" />
                  <p className="text-lg font-bold text-amber-950">
                    위치를 찾지 못했어요. 지역을 골라 주세요
                  </p>
                </div>
                <button
                  type="button"
                  onClick={() => requestCurrentPosition(true)}
                  className="inline-flex min-h-[44px] cursor-pointer items-center gap-1.5 rounded-xl border border-amber-300 bg-white px-4 py-2 text-sm font-bold text-amber-900 transition-colors hover:bg-amber-100 whitespace-nowrap shrink-0"
                >
                  <NavigationIcon className="h-4 w-4" />
                  <span>다시 위치 찾기</span>
                </button>
              </div>
            )}

            {gpsStatus === 'checking' && !selectedLocation && (
              <div
                role="status"
                aria-live="polite"
                className="flex items-center gap-3 rounded-2xl border border-zinc-200 bg-white px-5 py-4 text-base font-semibold text-zinc-700"
              >
                <Loader2Icon className="h-5 w-5 shrink-0 animate-spin text-blue-800" />
                <span>
                  현재 위치를 확인하고 있어요… 아래에서 바로 지역을 고를 수도 있어요.
                </span>
              </div>
            )}

            <div className="grid grid-cols-1 gap-8 lg:grid-cols-12 lg:items-start">
              {/* 왼쪽 영역: 지역 선택 */}
              <section
                aria-labelledby="region-heading"
                className="space-y-6 rounded-3xl border border-zinc-200 bg-white p-5 sm:p-6 lg:col-span-7"
              >
                <div className="flex flex-wrap items-center justify-between gap-3">
                  <h2
                    id="region-heading"
                    className="text-xl font-bold text-zinc-900"
                  >
                    지역을 골라 주세요
                  </h2>
                  {gpsStatus !== 'checking' && (
                    <button
                      type="button"
                      onClick={() => requestCurrentPosition(true)}
                      className="inline-flex min-h-[44px] cursor-pointer items-center gap-1.5 rounded-xl border border-zinc-200 bg-stone-50 px-3.5 py-2 text-sm font-semibold text-zinc-700 transition-colors hover:border-zinc-400 hover:bg-white whitespace-nowrap shrink-0"
                    >
                      <NavigationIcon className="h-4 w-4 text-blue-800" />
                      <span>현재 위치로 찾기</span>
                    </button>
                  )}
                </div>

                {/* 8개 시/도 버튼 */}
                <div className="grid grid-cols-2 gap-3 sm:grid-cols-4">
                  {CITIES.map((city) => {
                    const isSelected = selectedCity?.id === city.id;
                    return (
                      <button
                        key={city.id}
                        type="button"
                        aria-pressed={isSelected}
                        onClick={() => handleSelectCity(city)}
                        className={`min-h-[54px] rounded-2xl px-4 py-3 text-lg font-bold transition-all focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-800 active:scale-[0.98] ${
                          isSelected
                            ? 'border-[3px] border-blue-800 bg-blue-50 text-blue-950 shadow-sm'
                            : 'border border-zinc-200 bg-stone-50 text-zinc-800 hover:border-zinc-400 hover:bg-white'
                        }`}
                      >
                        {city.name}
                      </button>
                    );
                  })}
                </div>

                {/* 세부 지역 (서울: 동 단위 / 그 외: 군·구 단위) */}
                {selectedCity && (
                  <div className="space-y-4 border-t border-zinc-200 pt-5">
                    <div className="flex flex-wrap items-baseline justify-between gap-2">
                      <h3 className="text-lg font-bold text-zinc-900">
                        {selectedCity.name} ·{' '}
                        {selectedCity.subUnitLabel === '동'
                          ? '동 단위 선택'
                          : '군·구 단위 선택'}
                      </h3>
                      <span className="text-sm text-zinc-500">
                        원하는 지역을 누르면 바로 날씨를 확인해요
                      </span>
                    </div>

                    {selectedCity.id === 'seoul' && selectedCity.districts && (
                      <div className="space-y-4">
                        <div className="relative">
                          <SearchIcon className="pointer-events-none absolute top-1/2 left-4 h-5 w-5 -translate-y-1/2 text-zinc-400" />
                          <input
                            type="search"
                            value={seoulSearch}
                            onChange={(e) => setSeoulSearch(e.target.value)}
                            placeholder="동 또는 구 이름으로 찾기 (예: 역삼동, 명동, 잠실동)"
                            aria-label="서울 동 또는 구 이름 검색"
                            className="min-h-[52px] w-full rounded-2xl border border-zinc-300 bg-stone-50 py-3 pr-4 pl-12 text-base font-medium text-zinc-900 placeholder:text-zinc-400 focus:border-blue-800 focus:bg-white focus:outline-none"
                          />
                        </div>

                        {seoulSearch.trim().length === 0 && (
                          <div>
                            <p className="mb-2.5 text-sm font-semibold text-zinc-600">
                              먼저 구를 선택하세요
                            </p>
                            <div className="grid grid-cols-3 gap-2 sm:grid-cols-5">
                              {selectedCity.districts.map((district) => {
                                const isDistSelected =
                                  selectedSeoulDistrict === district;
                                return (
                                  <button
                                    key={district}
                                    type="button"
                                    aria-pressed={isDistSelected}
                                    onClick={() => setSelectedSeoulDistrict(district)}
                                    className={`min-h-[44px] rounded-xl px-2.5 py-2 text-[15px] font-bold whitespace-nowrap transition-colors ${
                                      isDistSelected
                                        ? 'bg-zinc-900 text-white'
                                        : 'bg-stone-100 text-zinc-700 hover:bg-stone-200'
                                    }`}
                                  >
                                    {district}
                                  </button>
                                );
                              })}
                            </div>
                          </div>
                        )}
                      </div>
                    )}

                    <div>
                      {selectedCity.id === 'seoul' && (
                        <p className="mb-2.5 text-sm font-semibold text-zinc-600">
                          {seoulSearch.trim().length > 0
                            ? `'${seoulSearch.trim()}' 검색 결과`
                            : `${selectedSeoulDistrict}의 동 선택`}
                        </p>
                      )}

                      {visibleSubRegions.length === 0 ? (
                        <p className="rounded-2xl bg-stone-50 px-4 py-6 text-center text-base font-medium text-zinc-500">
                          일치하는 동 이름이 없어요. 구 이름으로 먼저 선택해 보세요.
                        </p>
                      ) : (
                        <div className="grid grid-cols-2 gap-2.5 sm:grid-cols-3">
                          {visibleSubRegions.map((sub) => {
                            const isSubSelected = selectedSubRegionId === sub.id;
                            return (
                              <button
                                key={sub.id}
                                type="button"
                                aria-pressed={isSubSelected}
                                onClick={() =>
                                  handleSelectSubRegion(selectedCity, sub)
                                }
                                className={`min-h-[52px] rounded-2xl px-3.5 py-2.5 text-base font-bold transition-all focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-800 active:scale-[0.98] ${
                                  isSubSelected
                                    ? 'border-[3px] border-blue-800 bg-blue-50 text-blue-950 shadow-sm'
                                    : 'border border-zinc-200 bg-stone-50 text-zinc-800 hover:border-zinc-400 hover:bg-white'
                                }`}
                              >
                                {seoulSearch.trim().length > 0 && sub.district
                                  ? `${sub.district} ${sub.name}`
                                  : sub.name}
                              </button>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </section>

              {/* 오른쪽 영역: 오늘 날씨 결과 카드 */}
              <section
                aria-labelledby="weather-result-heading"
                className="rounded-3xl border border-zinc-200 bg-white p-5 sm:p-6 lg:col-span-5"
              >
                <div className="mb-4 flex items-center justify-between gap-2">
                  <h2
                    id="weather-result-heading"
                    className="text-xl font-bold text-zinc-900"
                  >
                    오늘 날씨
                  </h2>
                  {selectedLocation && (
                    <span className="text-sm font-semibold text-blue-800">
                      {selectedLocation.label}
                    </span>
                  )}
                </div>

                {weatherStatus === 'idle' && (
                  <div className="rounded-2xl bg-stone-50 px-5 py-10 text-center">
                    <p className="text-lg font-semibold text-zinc-700">
                      지역을 선택하면 오늘 날씨를 바로 보여드려요.
                    </p>
                    <p className="mt-1.5 text-sm text-zinc-500">
                      서울은 동 단위, 그 외 지역은 군·구 단위로 고를 수 있어요.
                    </p>
                  </div>
                )}

                {weatherStatus === 'loading' && (
                  <div
                    role="status"
                    aria-live="polite"
                    className="flex flex-col items-center justify-center gap-3 rounded-2xl bg-stone-50 px-5 py-12 text-center"
                  >
                    <Loader2Icon className="h-9 w-9 animate-spin text-blue-800" />
                    <p className="text-xl font-bold text-zinc-800">
                      날씨를 확인하는 중…
                    </p>
                  </div>
                )}

                {weatherStatus === 'error' && (
                  <div
                    role="alert"
                    className="space-y-4 rounded-2xl border border-rose-200 bg-rose-50 px-5 py-8 text-center"
                  >
                    <p className="text-base font-bold text-rose-900">
                      {weatherError}
                    </p>
                    {selectedLocation && (
                      <button
                        type="button"
                        onClick={() =>
                          loadWeatherForCoords(
                            selectedLocation.latitude,
                            selectedLocation.longitude
                          )
                        }
                        className="inline-flex min-h-[48px] cursor-pointer items-center gap-2 rounded-xl bg-rose-900 px-5 py-2.5 text-base font-bold text-white hover:bg-rose-800"
                      >
                        <RefreshCwIcon className="h-4 w-4" />
                        <span>다시 확인하기</span>
                      </button>
                    )}
                  </div>
                )}

                {weatherStatus === 'success' && weather && (
                  <div className="space-y-6">
                    <div className="rounded-2xl border border-blue-100 bg-blue-50/70 p-5 sm:p-6">
                      <p className="text-2xl leading-relaxed font-extrabold text-zinc-900 tabular-nums sm:text-[26px]">
                        {weather.weatherEmoji} 지금 {weather.temperature}℃ (체감{' '}
                        {weather.apparentTemperature}℃) · {weather.weatherLabel} / 오늘
                        최저 {weather.minTemp}℃ · 최고 {weather.maxTemp}℃ · 비 올 확률{' '}
                        {weather.precipitationProbability}%
                      </p>
                    </div>

                    <dl className="grid grid-cols-2 gap-4 border-t border-zinc-100 pt-4 text-left tabular-nums">
                      <div className="space-y-1">
                        <dt className="text-sm font-medium text-zinc-500">
                          지금 기온 / 체감
                        </dt>
                        <dd className="text-xl font-bold text-zinc-900">
                          {weather.temperature}℃{' '}
                          <span className="text-base font-semibold text-zinc-500">
                            (체감 {weather.apparentTemperature}℃)
                          </span>
                        </dd>
                      </div>

                      <div className="space-y-1">
                        <dt className="text-sm font-medium text-zinc-500">
                          날씨 상태
                        </dt>
                        <dd className="text-xl font-bold text-zinc-900">
                          {weather.weatherEmoji} {weather.weatherLabel}
                        </dd>
                      </div>

                      <div className="space-y-1">
                        <dt className="text-sm font-medium text-zinc-500">
                          오늘 최저 · 최고
                        </dt>
                        <dd className="text-xl font-bold text-zinc-900">
                          {weather.minTemp}℃ / {weather.maxTemp}℃
                        </dd>
                      </div>

                      <div className="space-y-1">
                        <dt className="text-sm font-medium text-zinc-500">
                          비 올 확률
                        </dt>
                        <dd className="text-xl font-bold text-zinc-900">
                          {weather.precipitationProbability}%
                        </dd>
                      </div>
                    </dl>
                  </div>
                )}
              </section>
            </div>

            {/* 하단 버튼 영역: 이전 + 🤖 옷차림 추천받기 */}
            <div className="space-y-3 border-t border-zinc-200 pt-6">
              {recommendNotice && (
                <div
                  role="status"
                  aria-live="polite"
                  className="rounded-2xl border border-blue-200 bg-blue-50 px-4 py-3 text-center text-base font-semibold text-blue-900"
                >
                  {recommendNotice}
                </div>
              )}

              <div className="grid grid-cols-1 gap-3 sm:grid-cols-12">
                <button
                  type="button"
                  onClick={onBack}
                  className="flex min-h-[60px] cursor-pointer items-center justify-center gap-2 rounded-2xl border border-zinc-300 bg-white px-6 py-4 text-xl font-bold text-zinc-800 transition-colors hover:bg-stone-100 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-800 active:scale-[0.99] sm:col-span-4"
                >
                  <ArrowLeftIcon className="h-6 w-6 shrink-0" />
                  <span>이전</span>
                </button>

                <button
                  type="button"
                  onClick={handleRecommendClick}
                  className="flex min-h-[60px] cursor-pointer items-center justify-center gap-2 rounded-2xl bg-blue-900 px-6 py-4 text-xl font-bold text-white shadow-md transition-all hover:bg-blue-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-800 active:scale-[0.99] sm:col-span-8"
                >
                  <span>🤖 옷차림 추천받기</span>
                </button>
              </div>
            </div>
          </div>
        );
      }

      // ---- 루트 앱 ----
      function App() {
        const [step, setStep] = useState(1);
        const [profile, setProfile] = useState({
          ageGroup: null,
          gender: null,
          style: null,
        });

        const handleAgeGroupChange = (ageGroup) => {
          setProfile((prev) => ({ ...prev, ageGroup }));
        };

        const handleGenderChange = (gender) => {
          setProfile((prev) => ({ ...prev, gender }));
        };

        const handleStyleChange = (style) => {
          setProfile((prev) => ({ ...prev, style }));
        };

        const handleGoNext = () => {
          setStep(2);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        const handleGoBack = () => {
          setStep(1);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        return (
          <div className="min-h-dvh bg-[#f8f7f4] text-zinc-900">
            <header className="sticky top-0 z-30 border-b border-zinc-200/80 bg-[#f8f7f4]/90 backdrop-blur-md">
              <div className="mx-auto flex max-w-5xl items-center justify-between gap-8 px-4 py-3.5 sm:px-6">
                <span className="text-xl font-extrabold tracking-tight text-zinc-900 whitespace-nowrap shrink-0">
                  앙드레2
                </span>

                <nav
                  aria-label="진행 단계"
                  className="flex items-center gap-2 text-sm font-semibold whitespace-nowrap shrink-0"
                >
                  <span
                    className={step === 1 ? 'text-blue-900' : 'text-zinc-400'}
                    aria-current={step === 1 ? 'step' : undefined}
                  >
                    1. 나에 대해
                  </span>
                  <span aria-hidden="true" className="text-zinc-300">
                    ·
                  </span>
                  <span
                    className={step === 2 ? 'text-blue-900' : 'text-zinc-400'}
                    aria-current={step === 2 ? 'step' : undefined}
                  >
                    2. 오늘 날씨
                  </span>
                </nav>
              </div>
            </header>

            <main className="mx-auto max-w-5xl px-4 py-6 sm:px-6 sm:py-10">
              {step === 1 ? (
                <AboutMeStep
                  profile={profile}
                  onChangeAgeGroup={handleAgeGroupChange}
                  onChangeGender={handleGenderChange}
                  onChangeStyle={handleStyleChange}
                  onNext={handleGoNext}
                />
              ) : (
                <WeatherStep onBack={handleGoBack} />
              )}
            </main>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
